<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - BF Barbearia</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="faixa"></div>

    <main class="centro">
        <div class="cartao">
            <img src="/static/images/logo.BF.jpg" alt="Logotipo BF Barbearia">
            <h1 style="text-align: center;">Painel BF</h1>
            <p class="sub" style="text-align: center;">Área reservada à equipa</p>

            {% if erro %}
                <div class="erro" role="alert">{{ erro }}</div>
            {% endif %}

            <form action="/admin/login" method="POST">
                <div class="campo">
                    <label for="utilizador">Utilizador</label>
                    <input type="text" id="utilizador" name="utilizador" required class="input" autocomplete="username">
                </div>
                <div class="campo" style="margin-bottom: 1.5rem;">
                    <label for="senha">Password</label>
                    <input type="password" id="senha" name="senha" required class="input" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-grande">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
